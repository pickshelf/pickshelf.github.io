# Rebuilds popular.json (the "🔥 N명이 봤어요" marks) from GA once a day. See scripts/popular.py.
# Needs the repository secret PICKSHELF_GA_SA_B64 (Settings → Secrets and variables → Actions).
name: popular
on:
  schedule:
    - cron: "17 19 * * *"  # 04:17 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - run: python3 scripts/popular.py
        env:
          PICKSHELF_GA_SA_B64: ${{ secrets.PICKSHELF_GA_SA_B64 }}
      - run: |
          git diff --quiet popular.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "popular.json: 클릭 수 갱신"
          git push
