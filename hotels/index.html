<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="icon" href="../favicon.png" sizes="32x32"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="description" content="영상에 나온 숙소 모음"><meta property="og:type" content="website"><meta property="og:title" content="숙소 모음"><meta property="og:description" content="영상에 나온 숙소 모음"><meta property="og:url" content="https://pickshelf.github.io/hotels/"><meta property="og:image" content="https://pickshelf.github.io/hotels/img/1.jpg"><meta property="og:image:width" content="480"><meta property="og:image:height" content="480"><meta name="twitter:card" content="summary_large_image">
<title>숙소 모음</title>
<style>
:root{--bg:#fffbea;--card:#ffffff;--fg:#1c1b17;--mut:#6f6b5e;--line:#ece4c4;--acc:#ffd400;--accfg:#1c1b17;--no:#1c1b17;--nofg:#ffd400}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--card:#22201a;--fg:#f2efe4;--mut:#a7a28f;--line:#38352a;--acc:#ffd400;--accfg:#1c1b17;--no:#ffd400;--nofg:#1c1b17}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.02em}.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.disc{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:14px}
.search{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:2}
input{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);outline:none}
input:focus{border-color:var(--acc)}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;scroll-margin-top:80px}
.card.hit{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 40%,transparent)}
.thumb{position:relative;flex:0 0 88px;height:88px;border-radius:10px;overflow:hidden;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.no{position:absolute;left:4px;top:4px;background:var(--no);color:var(--nofg);font-weight:800;font-size:13px;border-radius:7px;padding:1px 7px}
.body{flex:1;min-width:0}.name{font-weight:700;font-size:16px;margin:0 0 2px;overflow-wrap:anywhere}.note{color:var(--mut);font-size:13px;margin:0 0 8px}
.empty{color:var(--mut);text-align:center;padding:30px 0;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:700}
.cat{margin:26px 0 4px;scroll-margin-top:120px}.cat h2{font-size:18px;margin:0 0 2px}.hint{color:var(--mut);font-size:13px;margin:0 0 6px}
.soon{color:var(--mut);font-size:12px;border:1px dashed var(--line);border-radius:10px;padding:8px;text-align:center;margin:6px 0}
.cat.filled .soon{display:none}
.ticker{overflow:hidden;font-size:11px;color:var(--mut);margin:-12px -16px 14px;padding:6px 0;border-bottom:1px solid var(--line)}
.track{display:flex;width:max-content;animation:tick 26s linear infinite}
.track span{white-space:pre}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none;width:auto}.track span{white-space:normal;padding:0 16px}.track span+span{display:none}}
a.card{text-decoration:none;color:inherit;align-items:flex-start;padding:12px;position:relative}
a.card .thumb{flex-basis:96px;height:96px}
a.card .body{padding-right:14px}
a.card::after{content:"›";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--mut)}
a.card:active{transform:scale(.99)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;line-height:1.3}
.badge.tier.value{color:#fff;background:#2e9e5b}.badge.tier.mid{color:#fff;background:#7c5cd6}.badge.tier.high{color:#ffd400;background:#1c1b17}
.tiers .chip{font-size:12px;padding:4px 10px}.tiers .chip.on{background:var(--card);border-color:var(--fg);color:var(--fg)}
.badge.gift{color:#fff;background:#e8492f}
.badge.rocket{color:#1a73e8;background:color-mix(in srgb,#1a73e8 12%,transparent)}
.spec{color:var(--mut);font-size:13px;margin:0 0 6px}
a.card{align-items:center;min-height:120px}
a.card .name{display:flex;align-items:baseline;gap:6px;white-space:nowrap;margin:0 0 4px}a.card .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
a.card .gift{flex:0 0 auto;font-size:12px;font-weight:700;color:#e8492f}
a.card .thumb .tier{position:absolute;left:4px;bottom:4px}
.pts li.rocket{color:#1a73e8;border-color:color-mix(in srgb,#1a73e8 35%,transparent);font-weight:700}
a.card .badges,a.card .spec,a.card .pts{flex-wrap:nowrap;white-space:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
a.card .badges::-webkit-scrollbar,a.card .spec::-webkit-scrollbar,a.card .pts::-webkit-scrollbar{display:none}
a.card .badge,a.card .pts li{flex:0 0 auto}
.pts{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}.pts li{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.card.wait{opacity:1}.card.wait::after{content:none}.wait-note{display:inline-block;font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:8px;padding:2px 8px;margin-top:2px}
</style></head><body><div class="wrap">
<div class="ticker" role="note"><div class="track"><span>이 페이지에는 제휴 링크가 포함되어 있으며, 링크를 통해 예약하면 일정액의 수수료를 받을 수 있습니다. </span><span aria-hidden="true">이 페이지에는 제휴 링크가 포함되어 있으며, 링크를 통해 예약하면 일정액의 수수료를 받을 수 있습니다. </span></div></div>
<h1>숙소 모음</h1>
<div class="search"><input id="q" inputmode="search" placeholder="번호 또는 도시 (예: 후쿠오카)" autocomplete="off"></div>
<div id="list">
<div class="card wait" id="1" data-no="1" data-k="1 후쿠오카 하카타 몬탄 하카타 가성비 숙소 공항 한 정거장">
<div class="thumb"><img src="img/1.jpg" alt="" loading="lazy"><span class="no">1</span></div>
<div class="body">
<p class="name"><span class="nm">몬탄 하카타</span></p>
<p class="spec">후쿠오카 · 하카타 · 둘이 1만 엔 초반부터</p>
<ul class="pts"><li>공항 한 정거장</li><li>역 도보 5분</li><li>평점 9.1</li></ul>
<span class="wait-note">예약 링크 준비 중</span>
</div>
</div>
</div>
<p class="empty" id="empty">찾는 숙소가 없어요</p>
<p class="sub" style="margin-top:18px;font-size:12px">가격은 날짜·인원에 따라 달라요. 예약 전에 꼭 확인하세요.</p>
</div>
<script>
const q=document.getElementById('q'),cards=[...document.querySelectorAll('.card')],empty=document.getElementById('empty');
function f(){const v=q.value.trim().toLowerCase(),num=/^\d+$/.test(v);let n=0,exact=null;cards.forEach(c=>{const ok=!v||(num?c.dataset.no===v:c.dataset.k.includes(v));c.style.display=ok?'':'none';c.classList.toggle('hit',!!v&&c.dataset.no===v);if(ok)n++;if(c.dataset.no===v)exact=c});empty.style.display=n?'none':'block';if(exact)exact.scrollIntoView({block:'start'})}
q.addEventListener('input',f);const h=location.hash.replace('#','');if(h){q.value=h;f()}
</script></body></html>
