<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>영상 속 상품 모음</title>
<style>
:root{--bg:#fffbea;--card:#ffffff;--fg:#1c1b17;--mut:#6f6b5e;--line:#ece4c4;--acc:#ffd400;--accfg:#1c1b17;--no:#1c1b17;--nofg:#ffd400}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--card:#22201a;--fg:#f2efe4;--mut:#a7a28f;--line:#38352a;--acc:#ffd400;--accfg:#1c1b17;--no:#ffd400;--nofg:#1c1b17}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.02em}.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.disc{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:14px}
.search{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:2}
input{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);outline:none}
input:focus{border-color:var(--acc)}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;scroll-margin-top:80px}
.card.hit{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 40%,transparent)}
.thumb{position:relative;flex:0 0 88px;height:88px;border-radius:10px;overflow:hidden;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.no{position:absolute;left:4px;top:4px;background:var(--no);color:var(--nofg);font-weight:800;font-size:13px;border-radius:7px;padding:1px 7px}
.body{flex:1;min-width:0}.name{font-weight:700;font-size:16px;margin:0 0 2px;overflow-wrap:anywhere}.note{color:var(--mut);font-size:13px;margin:0 0 8px}
.btn{display:inline-block;background:var(--acc);color:var(--accfg);font-weight:700;font-size:14px;text-decoration:none;border-radius:10px;padding:8px 14px}
.btn.off{background:var(--line);color:var(--mut);pointer-events:none}
.empty{color:var(--mut);text-align:center;padding:30px 0;display:none}
</style></head><body><div class="wrap">
<h1>영상 속 상품 모음</h1><p class="sub">영상에 나온 번호로 찾아보세요</p>
<div class="disc">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
<div class="search"><input id="q" inputmode="search" placeholder="영상 번호 또는 상품명 (예: 26)" autocomplete="off"></div>
<div id="list"><div class="card" id="5" data-no="5" data-k="5 신발 밑창 접착제 생활 굳어도 말랑해서 구부려도 안 떨어지는 신발 전용 접착제"><div class="thumb"><img src="img/5.jpg" alt="" loading="lazy"><span class="no">5</span></div><div class="body"><p class="name">신발 밑창 접착제</p><p class="note">굳어도 말랑해서 구부려도 안 떨어지는 신발 전용 접착제</p><a class="btn" href="https://link.coupang.com/a/h0lcJtylhs" target="_blank" rel="sponsored noopener">쿠팡에서 보기</a></div></div>
<div class="card" id="3" data-no="3" data-k="3 곰팡이 제거젤 욕실 실리콘 곰팡이, 문지르지 말고 발라 두고 닦기"><div class="thumb"><img src="img/3.jpg" alt="" loading="lazy"><span class="no">3</span></div><div class="body"><p class="name">곰팡이 제거젤</p><p class="note">실리콘 곰팡이, 문지르지 말고 발라 두고 닦기</p><a class="btn" href="https://link.coupang.com/a/hZMFEVZbcO" target="_blank" rel="sponsored noopener">쿠팡에서 보기</a></div></div>
<div class="card" id="2" data-no="2" data-k="2 곰팡이 제거젤 욕실 실리콘·타일 줄눈에 바르고 기다렸다 닦는 젤"><div class="thumb"><img src="img/2.jpg" alt="" loading="lazy"><span class="no">2</span></div><div class="body"><p class="name">곰팡이 제거젤</p><p class="note">실리콘·타일 줄눈에 바르고 기다렸다 닦는 젤</p><a class="btn" href="https://link.coupang.com/a/hZMFEVZbcO" target="_blank" rel="sponsored noopener">쿠팡에서 보기</a></div></div>
<div class="card" id="1" data-no="1" data-k="1 미끄럼방지 욕실화 욕실 젖은 욕실 바닥에서 미끄럼 걱정 덜어주는 eva 욕실화"><div class="thumb"><img src="img/1.jpg" alt="" loading="lazy"><span class="no">1</span></div><div class="body"><p class="name">미끄럼방지 욕실화</p><p class="note">젖은 욕실 바닥에서 미끄럼 걱정 덜어주는 EVA 욕실화</p><a class="btn" href="https://link.coupang.com/a/hZMKoV6vYW" target="_blank" rel="sponsored noopener">쿠팡에서 보기</a></div></div></div><p class="empty" id="empty">찾는 상품이 없어요</p>
</div><script>
const q=document.getElementById('q'),cards=[...document.querySelectorAll('.card')],empty=document.getElementById('empty');
function f(){const v=q.value.trim().toLowerCase(),num=/^\d+$/.test(v);let n=0,exact=null;cards.forEach(c=>{const ok=!v||(num?c.dataset.no===v:c.dataset.k.includes(v));c.style.display=ok?'':'none';c.classList.toggle('hit',!!v&&c.dataset.no===v);if(ok)n++;if(c.dataset.no===v)exact=c});empty.style.display=n?'none':'block';if(exact)exact.scrollIntoView({block:'start'})}
q.addEventListener('input',f);const h=location.hash.replace('#','');if(h){q.value=h;f()}
</script></body></html>
